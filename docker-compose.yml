services:
  db:
    image: postgres:16-alpine
    container_name: eduflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-eduflow}
      POSTGRES_USER: ${POSTGRES_USER:-eduflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eduflow}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - eduflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eduflow} -d ${POSTGRES_DB:-eduflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  eduflow-postgres-data:
    name: eduflow-postgres-data
